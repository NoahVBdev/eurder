spring.application.name=eurder
spring.mvc.problemdetails.enabled=true

## Database
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}

## JPA
spring.jpa.properties.hibernate.default_schema=eurder
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

## Flyway
spring.flyway.default-schema=eurder
spring.flyway.schemas=eurder

## Logging
logging.level.root=INFO
logging.level.org.switchfully.eurder=INFO
logging.file.name=logs/eurder.log

## Security
eurder.security.admin.email=admin@eurder.com
eurder.security.admin.password=${EURDER_ADMIN_PASSWORD:admin-dev-password}